name: Build and deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Keep the same Markdown rendering and URLs as branch-based Pages.
      # Run before npm install so dependencies are not copied into the site.
      - name: Build existing Markdown site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: npm ci --prefix explorer
      - run: npm run --prefix explorer build:pages
      - run: npm run --prefix explorer test:static
      - run: npm run --prefix explorer test:docs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
