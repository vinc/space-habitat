name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Command-line smoke tests
        run: |
          python -m habitat_model --size 900 --stack six --tiers 2 --host L --site Eros > /dev/null
          python -m habitat_model --validate > /dev/null
          python -m habitat_model --json - > /dev/null
          python -m structure_model > /dev/null
          python -m dynamics_model > /dev/null
          python -m logistics_model > /dev/null
          python -m ecology_model > /dev/null
