name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python comes from mise.toml, the project's one pinned version.
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('mise.toml', 'requirements.txt') }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Command-line smoke tests
        run: |
          python -m habitat_model --size 900 --stack six --tiers 2 --host L --site Eros > /dev/null
          python -m habitat_model --validate > /dev/null
          python -m habitat_model --json - > /dev/null
          python -m structure_model > /dev/null
          python -m dynamics_model > /dev/null
          python -m logistics_model > /dev/null
          python -m logistics_model.shipping_study --report > /dev/null
          python -m ecology_model > /dev/null
          python -m optics_model > /dev/null
          python -m radiation_model > /dev/null

  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci --prefix explorer --ignore-scripts
      - run: npm run --prefix explorer check
      - run: node --test explorer/test_scene.js
