name: Split Blender assets once

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/split-blender-once.yml
      - rendering/_split_assets_once.py

permissions:
  contents: write

jobs:
  split:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/document-blender-rendering'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/document-blender-rendering
      - name: Download the verified Blender version
        shell: bash
        run: |
          blender_task_dir="$RUNNER_TEMP/blender-assets-once"
          mkdir -p "$blender_task_dir"
          curl --fail --location --retry 2 https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz -o "$blender_task_dir/blender.tar.xz"
          echo "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec  $blender_task_dir/blender.tar.xz" | sha256sum --check
          tar -xf "$blender_task_dir/blender.tar.xz" -C "$blender_task_dir"
      - name: Split and reopen the scene
        shell: bash
        run: |
          "$RUNNER_TEMP/blender-assets-once/blender-5.2.3-linux-x64/blender" -b --factory-startup --python-exit-code 1 --python rendering/_split_assets_once.py
      - name: Commit assets and remove temporary tooling
        shell: bash
        run: |
          git add rendering/assets/scene.blend rendering/assets/habitat.blend rendering/assets/vegetation.blend
          git rm rendering/space-habitat-900m.blend rendering/_split_assets_once.py .github/workflows/split-blender-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Split Blender scene into habitat and vegetation libraries'
          git push origin HEAD:codex/document-blender-rendering
