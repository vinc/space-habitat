name: Update Blender radiators once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/update-blender-radiators-once.yml
      - rendering/update_radiators.py
      - rendering/render_radiators_preview.py

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/blender-radiator-shafts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/blender-radiator-shafts
      - name: Download Blender 5.2.3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/blender-radiators"
          curl --fail --location --retry 2 https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz -o "$RUNNER_TEMP/blender-radiators/blender.tar.xz"
          echo "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec  $RUNNER_TEMP/blender-radiators/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender-radiators/blender.tar.xz" -C "$RUNNER_TEMP/blender-radiators"
      - name: Update, reopen and check the saved assets
        shell: bash
        run: |
          "$RUNNER_TEMP/blender-radiators/blender-5.2.3-linux-x64/blender" -b --factory-startup --python-exit-code 1 --python rendering/update_radiators.py
          "$RUNNER_TEMP/blender-radiators/blender-5.2.3-linux-x64/blender" -b --factory-startup --python-exit-code 1 --python rendering/update_radiators.py -- --check-only
          "$RUNNER_TEMP/blender-radiators/blender-5.2.3-linux-x64/blender" -b --factory-startup --python-exit-code 1 --python rendering/render_radiators_preview.py
      - name: Commit the assets and remove this one-time workflow
        shell: bash
        run: |
          git add rendering/assets/scene.blend rendering/assets/habitat.blend rendering/radiators-preview.png
          git rm .github/workflows/update-blender-radiators-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add elevator shafts and staggered radiator wings to the Blender assets'
          git push origin HEAD:codex/blender-radiator-shafts
