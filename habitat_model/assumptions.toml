# Inputs of the parametric system model, one entry per input.
#
# Each entry has a value, a unit, a low/high range for the sensitivity sweep,
# a source (section of notes.md or reference) and a status:
#   sourced   backed by a reference listed in the notes
#   estimate  a first-principles or literature-informed estimate
#   guess     a placeholder to revisit
#   design    a design choice, not an uncertainty (no range, not swept)
#
# Seeded from notes.md §19 (assumptions to revisit) and the "Still unsourced" list.
# Names are unique across groups; the groups are only for reading.

